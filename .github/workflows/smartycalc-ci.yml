name: SmartyCalc CI

on:
  push:
    branches:
      - main
    paths:
      - "SmartyCalc/**"
      - ".github/workflows/smartycalc-ci.yml"

  pull_request:
    branches:
      - main
    paths:
      - "SmartyCalc/**"
      - ".github/workflows/smartycalc-ci.yml"

jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: SmartyCalc

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build SmartyCalc
        shell: bash
        run: |
          mkdir -p build

          # Compile every .cpp/.CPP file in SmartyCalc (pure bash glob, no find/sort,
          # because Windows runners can resolve `find` to the Windows find.exe)
          shopt -s nocaseglob nullglob
          SOURCES=(*.cpp)

          if [ ${#SOURCES[@]} -eq 0 ]; then
            echo "No .cpp files found in $(pwd)"
            exit 1
          fi

          echo "Compiling ${#SOURCES[@]} files: ${SOURCES[*]}"
          g++ --version

          g++ -std=c++17 -Wall -Wextra -pedantic \
            "${SOURCES[@]}" \
            -o build/SmartyCalc.exe

      - name: Verify build
        shell: bash
        run: |
          test -f build/SmartyCalc.exe

      - name: Upload compiled program
        uses: actions/upload-artifact@v4
        with:
          name: SmartyCalc-Windows
          path: SmartyCalc/build/SmartyCalc.exe
